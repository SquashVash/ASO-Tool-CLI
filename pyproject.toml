[project]
name = "aso"
version = "0.1.0"
description = "Self-hosted ASO keyword research tool for the iOS App Store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.38",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.9",
]

[project.scripts]
aso = "aso.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
