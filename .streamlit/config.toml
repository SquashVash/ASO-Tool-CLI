# Streamlit defaults are wrong for this tool, in two ways worth fixing.

[server]
# Streamlit binds 0.0.0.0 by default and advertises a "Network URL" and an
# "External URL" on startup. This dashboard has no authentication — that is a
# deliberate design constraint of a single-user local tool, not an oversight —
# so binding to every interface publishes your keyword research, competitor
# lists and app tracking to anyone on the same network. Loopback only.
address = "localhost"

# Also suppresses Streamlit's interactive first-run welcome prompt, which asks
# for an email on stdin and blocks startup until answered — a hang, not a
# question, when launched from a script. The cost is that it no longer opens a
# browser tab for you; the URL is printed instead.
headless = true

[browser]
# Off by default here. This is a private research tool; which pages you open
# and how often is nobody else's business.
gatherUsageStats = false
